name: "Cherry Pick"

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GH_API_VERSION: "2026-03-10"

jobs:
  cherry_pick:
    name: "Cherry Pick"
    if: github.repository == 'buildzaku/zaku' && github.event.issue.pull_request && (github.event.comment.body == '/cherry-pick beta' || github.event.comment.body == '/cherry-pick stable')
    runs-on: ubuntu-24.04
    steps:
      - id: verify_request
        name: "Verify request"
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "should_cherry_pick=false" >>"${GITHUB_OUTPUT}"

          commenter_permission=$(gh api -H "X-GitHub-Api-Version: ${GH_API_VERSION}" "repos/${REPOSITORY}/collaborators/${COMMENTER_LOGIN}/permission" --jq .permission)
          case "$commenter_permission" in
            admin | write) ;;
            *) exit 0 ;;
          esac

          source_pull_request=$(gh pr view "$SOURCE_PULL_REQUEST_NUMBER" --repo "$REPOSITORY" --json baseRefName,mergeCommit,mergedAt)
          if ! jq --exit-status '.mergedAt != null and .baseRefName == "main"' <<<"$source_pull_request" >/dev/null; then
            exit 0
          fi

          commit_sha=$(jq --exit-status --raw-output '.mergeCommit.oid' <<<"$source_pull_request")
          echo "channel=${COMMENT_BODY#/cherry-pick }" >>"${GITHUB_OUTPUT}"
          echo "commit_sha=$commit_sha" >>"${GITHUB_OUTPUT}"
          echo "should_cherry_pick=true" >>"${GITHUB_OUTPUT}"
        shell: bash

      - name: "Checkout repository"
        if: steps.verify_request.outputs.should_cherry_pick == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.ZAKU_GITHUB_TOKEN }}

      - id: resolve_branch
        name: "Resolve branch"
        if: steps.verify_request.outputs.should_cherry_pick == 'true'
        env:
          CHANNEL: ${{ steps.verify_request.outputs.channel }}
        run: |
          branch=$(cargo app-version latest "$CHANNEL" --active --branch)
          if [[ -z "$branch" ]]; then
            echo "::error::There is no active release for the $CHANNEL channel"
            exit 1
          fi

          echo "branch=$branch" >>"${GITHUB_OUTPUT}"
          echo "Resolved $CHANNEL release branch: $branch"
        shell: bash

      - id: cherry_pick
        name: "Cherry pick commit"
        if: steps.verify_request.outputs.should_cherry_pick == 'true'
        env:
          BRANCH: ${{ steps.resolve_branch.outputs.branch }}
          COMMIT_SHA: ${{ steps.verify_request.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          GIT_COMMITTER_EMAIL: ${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.event.comment.user.login }}
        run: ./script/cherry-pick "$BRANCH" "$COMMIT_SHA"
        shell: bash

      - name: "React to comment"
        if: steps.cherry_pick.outcome == 'success'
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api -H "X-GitHub-Api-Version: ${GH_API_VERSION}" --method POST "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" --raw-field content=rocket >/dev/null
        shell: bash

      - name: "Reply with failure"
        if: failure() && steps.verify_request.outputs.should_cherry_pick == 'true' && steps.cherry_pick.outcome != 'success'
        env:
          CHANNEL: ${{ steps.verify_request.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf -v comment_body 'Cherry-pick to %s failed:\n\n%s' "$CHANNEL" "$WORKFLOW_RUN_URL"
          gh pr comment "$SOURCE_PULL_REQUEST_NUMBER" --body "$comment_body"
        shell: bash
