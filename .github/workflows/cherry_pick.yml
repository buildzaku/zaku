name: "Cherry Pick"

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write
  pull-requests: read

env:
  GH_API_VERSION: "2026-03-10"

jobs:
  cherry_pick:
    name: "Cherry Pick"
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/cherry-pick beta' || github.event.comment.body == '/cherry-pick stable')
    runs-on: ubuntu-24.04
    steps:
      - id: validate
        name: "Validate"
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER_LOGIN: ${{ github.event.comment.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "should_cherry_pick=false" >>"${GITHUB_OUTPUT}"

          if ! commenter_permission=$(gh api -H "X-GitHub-Api-Version: ${GH_API_VERSION}" "repos/${REPOSITORY}/collaborators/${COMMENTER_LOGIN}/permission" --jq .permission 2>/dev/null); then
            exit 0
          fi
          case "$commenter_permission" in
            admin | maintain | write) ;;
            *) exit 0 ;;
          esac

          source_pull_request=$(gh pr view "$SOURCE_PULL_REQUEST_NUMBER" --repo "$REPOSITORY" --json baseRefName,mergeCommit,mergedAt)
          if ! jq -e '.mergedAt != null and .baseRefName == "main"' <<<"$source_pull_request" >/dev/null; then
            exit 0
          fi

          echo "channel=${COMMENT_BODY#/cherry-pick }" >>"${GITHUB_OUTPUT}"
          echo "commit_sha=$(jq -r .mergeCommit.oid <<<"$source_pull_request")" >>"${GITHUB_OUTPUT}"
          echo "should_cherry_pick=true" >>"${GITHUB_OUTPUT}"
        shell: bash

      - name: "Checkout repository"
        if: steps.validate.outputs.should_cherry_pick == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.ZAKU_GITHUB_TOKEN }}

      - id: resolve_branch
        name: "Resolve branch"
        if: steps.validate.outputs.should_cherry_pick == 'true'
        env:
          CHANNEL: ${{ steps.validate.outputs.channel }}
        run: |
          branch=$(cargo run --quiet --package app_version -- latest "$CHANNEL" --active --branch)
          if [[ -z "$branch" ]]; then
            echo "::error::There is no active release for the $CHANNEL channel"
            exit 1
          fi

          echo "branch=$branch" >>"${GITHUB_OUTPUT}"
          echo "Resolved $CHANNEL release branch: $branch"
        shell: bash

      - id: cherry_pick
        name: "Cherry pick commit"
        if: steps.validate.outputs.should_cherry_pick == 'true'
        env:
          BRANCH: ${{ steps.resolve_branch.outputs.branch }}
          CHANNEL: ${{ steps.validate.outputs.channel }}
          COMMIT_SHA: ${{ steps.validate.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          GIT_COMMITTER_EMAIL: ${{ github.event.comment.user.id }}+${{ github.event.comment.user.login }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.event.comment.user.login }}
        run: |
          cherry_pick_pull_request_url=$(./script/cherry-pick "$BRANCH" "$COMMIT_SHA" "$CHANNEL")
          echo "cherry_pick_pull_request_url=${cherry_pick_pull_request_url}" >>"${GITHUB_OUTPUT}"
        shell: bash

      - name: "Reply with pull request"
        if: steps.cherry_pick.outcome == 'success'
        env:
          CHANNEL: ${{ steps.validate.outputs.channel }}
          CHERRY_PICK_PULL_REQUEST_URL: ${{ steps.cherry_pick.outputs.cherry_pick_pull_request_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
        run: |
          cherry_pick_pull_request_number="${CHERRY_PICK_PULL_REQUEST_URL##*/}"
          gh pr comment "$SOURCE_PULL_REQUEST_NUMBER" --body "Cherry-pick to ${CHANNEL} opened in #${cherry_pick_pull_request_number}."
        shell: bash

      - name: "Reply with failure"
        if: failure() && steps.validate.outputs.should_cherry_pick == 'true' && steps.cherry_pick.outcome != 'success'
        env:
          CHANNEL: ${{ steps.validate.outputs.channel }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf -v comment_body 'Cherry-pick to %s failed:\n\n%s' "$CHANNEL" "$WORKFLOW_RUN_URL"
          gh pr comment "$SOURCE_PULL_REQUEST_NUMBER" --body "$comment_body"
        shell: bash
