name: "Build"

on:
  workflow_call:
    inputs:
      version:
        description: "Zaku version"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: "Build ${{ matrix.name }}"
    if: github.repository == 'buildzaku/zaku'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - name: "Linux x86_64"
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: "macOS ARM64"
            os: macos-26
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            extension: dmg
          - name: "macOS x86_64"
            os: macos-26-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            extension: dmg
          - name: "Windows ARM64"
            os: windows-11-arm
            platform: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            extension: exe
          - name: "Windows x86_64"
            os: windows-2025
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Bash (macOS)"
        if: runner.os == 'macOS'
        run: brew install bash
        shell: bash

      - name: "Setup Cargo config (Linux and macOS)"
        if: runner.os != 'Windows'
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/workflow-config.toml ./../.cargo/config.toml
        shell: bash

      - name: "Setup Cargo config (Windows)"
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/workflow-config.toml" -Destination "./../.cargo/config.toml"
        shell: pwsh

      - name: "Install Inno Setup (Windows)"
        if: runner.os == 'Windows'
        env:
          INNO_SETUP_SHA256: 5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1
          INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $directory = Join-Path $env:RUNNER_TEMP "innosetup"

          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash
          if ($sha256 -ine $env:INNO_SETUP_SHA256) {
            throw "Unexpected Inno Setup installer checksum: $sha256"
          }

          $arguments = "/SP- /CURRENTUSER /DIR=`"$directory`" /NORESTART /PORTABLE=1 /SUPPRESSMSGBOXES /VERYSILENT"
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Could not install Inno Setup: exit code $($process.ExitCode)"
          }

          "ISCC_PATH=$(Join-Path $directory 'ISCC.exe')" >> $env:GITHUB_ENV
        shell: pwsh

      - name: "Install dependencies (Linux)"
        if: runner.os == 'Linux'
        run: ./script/linux
        shell: bash

      - name: "Build bundle (Linux and macOS)"
        if: runner.os != 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: "./script/bundle-${PLATFORM} --arch ${ARCH}"
        shell: bash

      - name: "Build bundle (Windows)"
        if: runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
        run: ./script/bundle-windows.ps1 -Arch $env:ARCH
        shell: pwsh

      - name: "Upload bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zaku-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          path: target/${{ matrix.target }}/release/Zaku-${{ inputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
