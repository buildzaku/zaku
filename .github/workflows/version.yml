name: "Version"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Version command"
        required: true
        type: choice
        options:
          - "bump patch"
          - "bump beta"
          - "promote stable"
      branch:
        description: "Release branch"
        required: true
        type: string
      source_sha:
        description: "Release branch commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  update:
    name: "Update branch"
    if: github.repository == 'buildzaku/zaku'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: "Install cargo-edit"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-edit@0.13.13

      - name: "Update version"
        env:
          COMMAND: ${{ inputs.command }}
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ inputs.branch }}
        run: |
          case "$COMMAND" in
            "bump patch")
              source_channel=stable
              version_operation=bump
              version_argument=patch
              cargo_bump=patch
              ;;
            "bump beta")
              source_channel=beta
              version_operation=bump
              version_argument=beta
              cargo_bump=beta
              ;;
            "promote stable")
              source_channel=beta
              version_operation=promote
              version_argument=stable
              cargo_bump=release
              ;;
            *)
              echo "::error::Unsupported version command: $COMMAND"
              exit 1
              ;;
          esac

          current_version=$(cargo app-version show)
          release_branch=$(cargo app-version show "$current_version" --branch)
          if [[ "$TARGET_BRANCH" != "$release_branch" ]]; then
            echo "::error::Release branch $TARGET_BRANCH contains version $current_version"
            exit 1
          fi

          version=$(cargo app-version "$version_operation" "$current_version" "$version_argument")

          active_version=$(cargo app-version latest "$source_channel" --active)
          if [[ -z "$active_version" ]]; then
            echo "::error::There is no active release for the $source_channel channel"
            exit 1
          fi
          if [[ "$active_version" != "$current_version" ]]; then
            echo "::error::$TARGET_BRANCH is not the latest $source_channel release branch"
            exit 1
          fi

          files=(Cargo.toml Cargo.lock)
          cargo set-version --workspace --bump "$cargo_bump"
          actual_version=$(cargo app-version show)
          if [[ "$actual_version" != "$version" ]]; then
            echo "::error::Expected Zaku $version, found $actual_version"
            exit 1
          fi
          expected_files=$(printf '%s\n' "${files[@]}" | sort)
          changed_files=$(git diff --name-only | sort)
          if [[ "$changed_files" != "$expected_files" ]]; then
            echo "::error::Unexpected file changes on $TARGET_BRANCH"
            printf 'Changed files:\n%s\n' "${changed_files:-none}"
            exit 1
          fi
          commit_sha=$(./script/gh-commit update "$TARGET_BRANCH" "Zaku $version" "${files[@]}")

          echo "Updated $TARGET_BRANCH to Zaku $version at $commit_sha"
        shell: bash
