name: "Release"

on:
  push:
    tags:
      - "[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - beta
          - stable
      source_sha:
        description: "Main branch commit SHA"
        required: true
        type: string
      bump_year:
        description: "Bump release year"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  start_release:
    name: "Start release"
    if: github.repository == 'buildzaku/zaku' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.ZAKU_GITHUB_TOKEN }}

      - name: "Install cargo-edit"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-edit@0.13.13

      - name: "Create release branch and advance main"
        env:
          ACTOR_ID: ${{ github.actor_id }}
          ACTOR_LOGIN: ${{ github.actor }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUMP_YEAR: ${{ inputs.bump_year }}
        run: |
          source_version=$(cargo app-version show)
          if [[ "$BUMP_YEAR" == "true" ]]; then
            source_version=$(cargo app-version bump "$source_version" year)
          fi
          release_version=$(cargo app-version promote "$source_version" "$CHANNEL")
          release_long_version=$(cargo app-version show "$release_version" --long)
          release_branch=$(cargo app-version show "$release_version" --branch)
          main_version=$(cargo app-version bump "$source_version" minor)
          main_long_version=$(cargo app-version show "$main_version" --long)

          if git ls-remote --exit-code --branches origin "refs/heads/${release_branch}" >/dev/null 2>&1; then
            echo "::error::Release branch already exists: $release_branch"
            exit 1
          fi
          if ! remote_main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1); then
            echo "::error::Could not resolve origin/main"
            exit 1
          fi
          if [[ "$remote_main_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Source no longer matches main: expected $SOURCE_SHA, found $remote_main_sha"
            exit 1
          fi

          active_beta_version=$(cargo app-version latest beta --active)
          if [[ -n "$active_beta_version" ]]; then
            echo "::error::Promote the active beta before creating another release line: $active_beta_version"
            exit 1
          fi

          git config user.name "$ACTOR_LOGIN"
          git config user.email "${ACTOR_ID}+${ACTOR_LOGIN}@users.noreply.github.com"

          git switch --create "$release_branch" "$SOURCE_SHA"
          cargo set-version --workspace "$release_long_version"
          expected_version_files=$(printf '%s\n' Cargo.toml Cargo.lock | sort)
          changed_version_files=$(git diff --name-only | sort)
          if [[ "$changed_version_files" != "$expected_version_files" ]]; then
            echo "::error::Unexpected file changes on $release_branch"
            printf 'Changed files:\n%s\n' "${changed_version_files:-none}"
            exit 1
          fi
          git add -- Cargo.toml Cargo.lock
          git commit --message "Zaku $release_version"
          release_sha=$(git rev-parse HEAD)
          git tag --annotate --message "Zaku $release_version" "$release_version" "$release_sha"

          git switch --create "main-$main_version" "$SOURCE_SHA"
          cargo set-version --workspace "$main_long_version"
          changed_version_files=$(git diff --name-only | sort)
          if [[ "$changed_version_files" != "$expected_version_files" ]]; then
            echo "::error::Unexpected file changes on main"
            printf 'Changed files:\n%s\n' "${changed_version_files:-none}"
            exit 1
          fi
          git add -- Cargo.toml Cargo.lock
          git commit --message "Update Zaku to $main_version"
          main_sha=$(git rev-parse HEAD)

          git push --atomic origin "${main_sha}:refs/heads/main" "${release_sha}:refs/heads/${release_branch}" "refs/tags/${release_version}"
          echo "Updated main to $main_version and created $release_branch with release tag $release_version"
        shell: bash

  github_release:
    name: "Check or create GitHub release"
    if: github.repository == 'buildzaku/zaku' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.verify_release.outputs.channel }}
      github_release_status: ${{ steps.check_release.outputs.github_release_status }}
      manifest_exists: ${{ steps.check_release.outputs.manifest_exists }}
      version: ${{ steps.verify_release.outputs.version }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: verify_release
        name: "Verify release"
        run: |
          version=$(cargo app-version show)
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

          channel=$(cargo app-version show "$version" --channel)
          release_branch=$(cargo app-version show "$version" --branch)
          case "$channel" in
            beta) prerelease=true ;;
            stable) prerelease=false ;;
          esac

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"; then
            echo "::error::Release tag is not part of $release_branch: $version"
            exit 1
          fi

          echo "channel=$channel" >>"${GITHUB_OUTPUT}"
          echo "prerelease=$prerelease" >>"${GITHUB_OUTPUT}"
          echo "version=$version" >>"${GITHUB_OUTPUT}"
          echo "Verified $channel release $version on $release_branch"
        shell: bash

      - id: check_release
        name: "Check release state"
        env:
          CHANNEL: ${{ steps.verify_release.outputs.channel }}
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.verify_release.outputs.prerelease }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.verify_release.outputs.version }}
        run: |
          if release=$(gh release view "$VERSION" --json isDraft,isPrerelease --repo "$REPOSITORY" 2>/dev/null); then
            if ! jq --exit-status --argjson prerelease "$PRERELEASE" '.isPrerelease == $prerelease' <<<"$release" >/dev/null; then
              echo "::error::Existing GitHub Release does not match $VERSION"
              exit 1
            fi
            if [[ "$(jq --raw-output '.isDraft' <<<"$release")" == "true" ]]; then
              github_release_status=draft
            else
              github_release_status=published
            fi
            echo "Resuming GitHub Release for $VERSION"
          else
            github_release_status=missing
          fi

          status=$(curl -sSI -o /dev/null -w '%{http_code}' "https://api.zaku.dev/releases/${CHANNEL}/${VERSION}")
          case "$status" in
            200)
              manifest_exists=true
              ;;
            404)
              manifest_exists=false
              ;;
            *)
              echo "::error::Could not inspect server manifest: HTTP $status"
              exit 1
              ;;
          esac
          if [[ "$github_release_status" == "published" && "$manifest_exists" == "false" ]]; then
            echo "::error::Published GitHub Release has no server manifest: $VERSION"
            exit 1
          fi
          if [[ "$github_release_status" == "missing" && "$manifest_exists" == "true" ]]; then
            echo "::error::Server manifest has no GitHub Release: $VERSION"
            exit 1
          fi
          if [[ "$github_release_status" == "missing" ]]; then
            gh release create "$VERSION" --draft --notes "" --prerelease="$PRERELEASE" --repo "$REPOSITORY" --title "Zaku $VERSION" --verify-tag
            github_release_status=draft
            echo "Created draft GitHub Release for $VERSION"
          fi

          echo "github_release_status=$github_release_status" >>"${GITHUB_OUTPUT}"
          echo "manifest_exists=$manifest_exists" >>"${GITHUB_OUTPUT}"
        shell: bash

  build:
    name: "Build ${{ matrix.name }}"
    needs: github_release
    if: needs.github_release.outputs.manifest_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - name: "Linux x86_64"
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: "macOS ARM64"
            os: macos-26
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            extension: dmg
          - name: "macOS x86_64"
            os: macos-26-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            extension: dmg
          - name: "Windows ARM64"
            os: windows-11-arm
            platform: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            extension: exe
          - name: "Windows x86_64"
            os: windows-2025
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Bash (macOS)"
        if: runner.os == 'macOS'
        run: brew install bash
        shell: bash

      - name: "Setup Cargo config (Linux and macOS)"
        if: runner.os != 'Windows'
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/workflow-config.toml ./../.cargo/config.toml
        shell: bash

      - name: "Setup Cargo config (Windows)"
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/workflow-config.toml" -Destination "./../.cargo/config.toml"
        shell: pwsh

      - name: "Install Inno Setup (Windows)"
        if: runner.os == 'Windows'
        env:
          INNO_SETUP_SHA256: 5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1
          INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $directory = Join-Path $env:RUNNER_TEMP "innosetup"

          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash
          if ($sha256 -ne $env:INNO_SETUP_SHA256) {
            throw "Unexpected Inno Setup installer checksum: $sha256"
          }

          $arguments = "/SP- /CURRENTUSER /DIR=`"$directory`" /NORESTART /PORTABLE=1 /SUPPRESSMSGBOXES /VERYSILENT"
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Could not install Inno Setup: exit code $($process.ExitCode)"
          }

          "ISCC_PATH=$(Join-Path $directory 'ISCC.exe')" >> $env:GITHUB_ENV
        shell: pwsh

      - name: "Install dependencies (Linux)"
        if: runner.os == 'Linux'
        run: ./script/linux
        shell: bash

      - name: "Build bundle (Linux and macOS)"
        if: runner.os != 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: "./script/bundle-${PLATFORM} --arch ${ARCH}"
        shell: bash

      - name: "Build bundle (Windows)"
        if: runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
        run: ./script/bundle-windows.ps1 -Arch $env:ARCH
        shell: pwsh

      - name: "Upload bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zaku-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/Zaku-${{ needs.github_release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  publish_release:
    name: "Publish release"
    needs:
      - github_release
      - build
    if: needs.github_release.outputs.manifest_exists == 'false'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      PUBLISH_ARTIFACTS: "true"
    steps: &publish_steps
      - name: "Download bundles"
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: "Upload release artifacts"
        if: env.PUBLISH_ARTIFACTS == 'true'
        env:
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.github_release.outputs.version }}
        run: gh release upload "$VERSION" artifacts/* --clobber --repo "$REPOSITORY"
        shell: bash

      - name: "Register, publish and promote release"
        env:
          CHANNEL: ${{ needs.github_release.outputs.channel }}
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          GH_RELEASE_STATUS: ${{ needs.github_release.outputs.github_release_status }}
          MANIFEST_EXISTS: ${{ needs.github_release.outputs.manifest_exists }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.github_release.outputs.version }}
        run: |
          oidc_token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.zaku.dev" | jq --exit-status --raw-output '.value')

          if [[ "$MANIFEST_EXISTS" == "false" ]]; then
            request_body=$(gh release view "$VERSION" --json assets --repo "$REPOSITORY" --jq '{
              artifacts: [.assets[] | {
                name,
                size,
                sha256: (.digest | ltrimstr("sha256:"))
              }]
            }')
            curl -fsS -X PUT -H "Authorization: Bearer ${oidc_token}" --json "$request_body" "https://api.zaku.dev/releases/${CHANNEL}/${VERSION}"
          fi

          if [[ "$GH_RELEASE_STATUS" == "draft" ]]; then
            gh release edit "$VERSION" --draft=false --latest=false --repo "$REPOSITORY"
          fi

          curl -fsS -X PUT -H "Authorization: Bearer ${oidc_token}" "https://api.zaku.dev/releases/${CHANNEL}/latest"

          if [[ "$CHANNEL" == "stable" ]]; then
            gh release edit "$VERSION" --latest --repo "$REPOSITORY"
          fi

          echo "Released Zaku $VERSION"
        shell: bash

  resume_release:
    name: "Resume release"
    needs: github_release
    if: needs.github_release.outputs.manifest_exists == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    env:
      PUBLISH_ARTIFACTS: "false"
    steps: *publish_steps
