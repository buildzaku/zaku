name: "Release"

on:
  push:
    tags:
      - "[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - beta
          - stable
      source_sha:
        description: "Main branch commit SHA"
        required: true
        type: string
      bump_year:
        description: "Bump release year"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare_release:
    name: "Prepare release"
    if: github.repository == 'buildzaku/zaku' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}

      - name: "Install cargo-edit"
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-edit@0.13.13

      - id: create_branches
        name: "Create branches"
        env:
          BUMP_YEAR: ${{ inputs.bump_year }}
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source_version=$(cargo app-version show)
          if [[ "$BUMP_YEAR" == "true" ]]; then
            source_version=$(cargo app-version bump "$source_version" year)
          fi
          release_version=$(cargo app-version promote "$source_version" "$CHANNEL")
          release_long_version=$(cargo app-version show "$release_version" --long)
          release_branch=$(cargo app-version show "$release_version" --branch)
          main_version=$(cargo app-version bump "$source_version" minor)
          main_long_version=$(cargo app-version show "$main_version" --long)
          main_branch="main-${main_version}"
          source_sha=$(git rev-parse HEAD)

          if ! remote_main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1); then
            echo "::error::Could not resolve origin/main"
            exit 1
          fi
          if [[ "$remote_main_sha" != "$source_sha" ]]; then
            echo "::error::Source no longer matches main: expected $source_sha, found $remote_main_sha"
            exit 1
          fi

          active_beta_version=$(cargo app-version latest beta --active)
          if [[ -n "$active_beta_version" ]]; then
            echo "::error::Promote the active beta before creating another release line: $active_beta_version"
            exit 1
          fi

          files=(Cargo.toml Cargo.lock)
          cargo set-version --workspace "$release_long_version"
          expected_files=$(printf '%s\n' "${files[@]}" | sort)
          changed_files=$(git diff --name-only | sort)
          if [[ "$changed_files" != "$expected_files" ]]; then
            echo "::error::Unexpected file changes on $release_branch"
            printf 'Changed files:\n%s\n' "${changed_files:-none}"
            exit 1
          fi
          ./script/gh-commit create "$release_branch" "Zaku $release_version" "${files[@]}" >/dev/null

          git restore --source "$source_sha" -- "${files[@]}"
          cargo set-version --workspace "$main_long_version"
          changed_files=$(git diff --name-only | sort)
          if [[ "$changed_files" != "$expected_files" ]]; then
            echo "::error::Unexpected file changes on main"
            printf 'Changed files:\n%s\n' "${changed_files:-none}"
            exit 1
          fi
          ./script/gh-commit create "$main_branch" "Update Zaku to $main_version" "${files[@]}" >/dev/null

          echo "main_branch=$main_branch" >>"${GITHUB_OUTPUT}"
          echo "main_version=$main_version" >>"${GITHUB_OUTPUT}"
        shell: bash

      - name: "Create ${{ steps.create_branches.outputs.main_version }} pull request"
        env:
          GH_TOKEN: ${{ secrets.ZAKU_GITHUB_TOKEN }}
          MAIN_BRANCH: ${{ steps.create_branches.outputs.main_branch }}
          MAIN_VERSION: ${{ steps.create_branches.outputs.main_version }}
        run: |
          pull_request_url=$(gh pr list --base main --head "$MAIN_BRANCH" --repo "$GITHUB_REPOSITORY" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$pull_request_url" ]]; then
            pull_request_url=$(gh pr create --base main --body "" --head "$MAIN_BRANCH" --repo "$GITHUB_REPOSITORY" --title "Update Zaku to $MAIN_VERSION")
          fi

          echo "Pull request to advance main: $pull_request_url"
        shell: bash

  verify_release:
    name: "Verify release"
    if: github.repository == 'buildzaku/zaku' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.verify_tag.outputs.channel }}
      prerelease: ${{ steps.verify_tag.outputs.prerelease }}
      version: ${{ steps.verify_tag.outputs.version }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: verify_tag
        name: "Verify tag"
        run: |
          keyring=$(mktemp -d)
          trap 'rm -rf "$keyring"' EXIT
          export GNUPGHOME="$keyring"

          shopt -s nullglob
          release_keys=(.github/release-keys/*.asc)
          if [[ ${#release_keys[@]} -eq 0 ]]; then
            echo "::error::No release signing keys found"
            exit 1
          fi
          gpg --batch --import "${release_keys[@]}"
          git verify-tag "$GITHUB_REF_NAME"

          version=$(cargo app-version show)
          if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi

          channel=$(cargo app-version show "$version" --channel)
          release_branch=$(cargo app-version show "$version" --branch)
          case "$channel" in
            beta) prerelease=true ;;
            stable) prerelease=false ;;
            *)
              echo "::error::Unsupported release channel: $channel"
              exit 1
              ;;
          esac

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"; then
            echo "::error::Release tag is not part of $release_branch: $version"
            exit 1
          fi

          echo "channel=$channel" >>"${GITHUB_OUTPUT}"
          echo "prerelease=$prerelease" >>"${GITHUB_OUTPUT}"
          echo "version=$version" >>"${GITHUB_OUTPUT}"
          echo "Verified $channel release $version on $release_branch"
        shell: bash

  gh_release:
    name: "Check or create GitHub release"
    needs: verify_release
    if: github.repository == 'buildzaku/zaku' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      channel: ${{ needs.verify_release.outputs.channel }}
      status: ${{ steps.check_release.outputs.status }}
      manifest_exists: ${{ steps.check_release.outputs.manifest_exists }}
      version: ${{ needs.verify_release.outputs.version }}
    steps:
      - id: check_release
        name: "Check release state"
        env:
          CHANNEL: ${{ needs.verify_release.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify_release.outputs.prerelease }}
          VERSION: ${{ needs.verify_release.outputs.version }}
        run: |
          if release=$(gh release view "$VERSION" --json isDraft,isPrerelease --repo "$GITHUB_REPOSITORY" 2>/dev/null); then
            if ! jq --exit-status --argjson prerelease "$PRERELEASE" '.isPrerelease == $prerelease' <<<"$release" >/dev/null; then
              echo "::error::Existing GitHub Release does not match $VERSION"
              exit 1
            fi
            if [[ "$(jq --raw-output '.isDraft' <<<"$release")" == "true" ]]; then
              github_release_status=draft
            else
              github_release_status=published
            fi
            echo "Resuming GitHub Release for $VERSION"
          else
            github_release_status=missing
          fi

          status=$(curl -sSI -o /dev/null -w '%{http_code}' "https://api.zaku.dev/releases/${CHANNEL}/${VERSION}")
          case "$status" in
            200)
              manifest_exists=true
              ;;
            404)
              manifest_exists=false
              ;;
            *)
              echo "::error::Could not inspect server manifest: HTTP $status"
              exit 1
              ;;
          esac
          if [[ "$github_release_status" == "published" && "$manifest_exists" == "false" ]]; then
            echo "::error::Published GitHub Release has no server manifest: $VERSION"
            exit 1
          fi
          if [[ "$github_release_status" == "missing" && "$manifest_exists" == "true" ]]; then
            echo "::error::Server manifest has no GitHub Release: $VERSION"
            exit 1
          fi
          if [[ "$github_release_status" == "missing" ]]; then
            gh release create "$VERSION" --draft --notes "" --prerelease="$PRERELEASE" --repo "$GITHUB_REPOSITORY" --title "Zaku $VERSION" --verify-tag
            github_release_status=draft
            echo "Created draft GitHub Release for $VERSION"
          fi

          echo "status=$github_release_status" >>"${GITHUB_OUTPUT}"
          echo "manifest_exists=$manifest_exists" >>"${GITHUB_OUTPUT}"
        shell: bash

  build:
    name: "Build ${{ matrix.name }}"
    needs: gh_release
    if: needs.gh_release.outputs.manifest_exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
          - name: "Linux x86_64"
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - name: "macOS ARM64"
            os: macos-26
            platform: macos
            arch: aarch64
            target: aarch64-apple-darwin
            extension: dmg
          - name: "macOS x86_64"
            os: macos-26-intel
            platform: macos
            arch: x86_64
            target: x86_64-apple-darwin
            extension: dmg
          - name: "Windows ARM64"
            os: windows-11-arm
            platform: windows
            arch: aarch64
            target: aarch64-pc-windows-msvc
            extension: exe
          - name: "Windows x86_64"
            os: windows-2025
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Check diagnostics configuration"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZAKU_CHECKSUM_SEED: ${{ secrets.ZAKU_CHECKSUM_SEED }}
          ZAKU_MINIDUMP_ENDPOINT: ${{ vars.ZAKU_MINIDUMP_ENDPOINT }}
        run: |
          for variable in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT ZAKU_CHECKSUM_SEED ZAKU_MINIDUMP_ENDPOINT; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::$variable is not configured"
              exit 1
            fi
          done
        shell: bash

      - name: "Install sentry-cli (Linux and macOS)"
        if: runner.os != 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          SENTRY_CLI_VERSION: "3.6.2"
        run: |
          case "${RUNNER_OS}-${ARCH}" in
            Linux-aarch64)
              artifact=sentry-cli-Linux-aarch64
              expected_sha256=ff112ecf694b7d6b3629a6228ed4e3f7a0d51401bdf48a5051a79d8749dccd06
              ;;
            Linux-x86_64)
              artifact=sentry-cli-Linux-x86_64
              expected_sha256=3a4bbf2c0d06378d4e59b337647483751a0a2b1603db5fd4991847d0cfd6478c
              ;;
            macOS-aarch64)
              artifact=sentry-cli-Darwin-arm64
              expected_sha256=5a497deb1e388cc6445c09ddd6d2da4fc2aae8295405d6393c2e0ee635ca3687
              ;;
            macOS-x86_64)
              artifact=sentry-cli-Darwin-x86_64
              expected_sha256=efe0a5289cdd0ea8ff727b1228a1bea6c840f2da38152e8f9f5ced05bd6659cd
              ;;
            *)
              echo "::error::Unsupported sentry-cli target: ${RUNNER_OS}-${ARCH}"
              exit 1
              ;;
          esac

          sentry_cli_path="${RUNNER_TEMP}/sentry-cli"
          curl -fsSL "https://downloads.sentry-cdn.com/sentry-cli/${SENTRY_CLI_VERSION}/${artifact}" -o "$sentry_cli_path"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sha256=$(shasum -a 256 "$sentry_cli_path")
          else
            sha256=$(sha256sum "$sentry_cli_path")
          fi
          sha256="${sha256%% *}"
          if [[ "$sha256" != "$expected_sha256" ]]; then
            echo "::error::Unexpected sentry-cli checksum: $sha256"
            exit 1
          fi

          chmod +x "$sentry_cli_path"
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"
        shell: bash

      - name: "Install sentry-cli (Windows)"
        if: runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          SENTRY_CLI_VERSION: "3.6.2"
        run: |
          $artifact, $expectedSha256 = switch ($env:ARCH) {
              "aarch64" {
                  "sentry-cli-Windows-aarch64.exe"
                  "93ee7916c05c113a35daccf107c034af96f279561c103aa832668e4eecca3fb4"
              }
              "x86_64" {
                  "sentry-cli-Windows-x86_64.exe"
                  "5c90cb0045cef3d3c36113c2aa21a7dcae11627d2d6e3098b679dea5b6681be3"
              }
              default { throw "Unsupported sentry-cli target: Windows-$env:ARCH" }
          }

          $sentryCliPath = Join-Path $env:RUNNER_TEMP "sentry-cli.exe"
          $url = "https://downloads.sentry-cdn.com/sentry-cli/$env:SENTRY_CLI_VERSION/$artifact"
          Invoke-WebRequest -Uri $url -OutFile $sentryCliPath
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $sentryCliPath).Hash.ToLowerInvariant()
          if ($sha256 -ne $expectedSha256) {
              throw "Unexpected sentry-cli checksum: $sha256"
          }

          $env:RUNNER_TEMP >> $env:GITHUB_PATH
        shell: pwsh

      - name: "Install Bash (macOS)"
        if: runner.os == 'macOS'
        run: brew install bash
        shell: bash

      - name: "Setup Cargo config (Linux and macOS)"
        if: runner.os != 'Windows'
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/workflow-config.toml ./../.cargo/config.toml
        shell: bash

      - name: "Setup Cargo config (Windows)"
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/workflow-config.toml" -Destination "./../.cargo/config.toml"
        shell: pwsh

      - name: "Install Inno Setup (Windows)"
        if: runner.os == 'Windows'
        env:
          INNO_SETUP_SHA256: 5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1
          INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $directory = Join-Path $env:RUNNER_TEMP "innosetup"

          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $installer
          $sha256 = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash
          if ($sha256 -ne $env:INNO_SETUP_SHA256) {
            throw "Unexpected Inno Setup installer checksum: $sha256"
          }

          $arguments = "/SP- /CURRENTUSER /DIR=`"$directory`" /NORESTART /PORTABLE=1 /SUPPRESSMSGBOXES /VERYSILENT"
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Could not install Inno Setup: exit code $($process.ExitCode)"
          }

          "ISCC_PATH=$(Join-Path $directory 'ISCC.exe')" >> $env:GITHUB_ENV
        shell: pwsh

      - name: "Install dependencies (Linux)"
        if: runner.os == 'Linux'
        run: ./script/linux
        shell: bash

      - name: "Build bundle (Linux and macOS)"
        if: runner.os != 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZAKU_CHECKSUM_SEED: ${{ secrets.ZAKU_CHECKSUM_SEED }}
          ZAKU_MINIDUMP_ENDPOINT: ${{ vars.ZAKU_MINIDUMP_ENDPOINT }}
        run: "./script/bundle-${PLATFORM} --arch ${ARCH}"
        shell: bash

      - name: "Build bundle (Windows)"
        if: runner.os == 'Windows'
        env:
          ARCH: ${{ matrix.arch }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          ZAKU_CHECKSUM_SEED: ${{ secrets.ZAKU_CHECKSUM_SEED }}
          ZAKU_MINIDUMP_ENDPOINT: ${{ vars.ZAKU_MINIDUMP_ENDPOINT }}
        run: ./script/bundle-windows.ps1 -Arch $env:ARCH
        shell: pwsh

      - name: "Upload bundle"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Zaku-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/Zaku-${{ needs.gh_release.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  publish_release:
    name: "Publish release"
    needs:
      - gh_release
      - build
    if: needs.gh_release.outputs.manifest_exists == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH_ARTIFACTS: "true"
    steps: &publish_steps
      - name: "Download bundles"
        if: env.PUBLISH_ARTIFACTS == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: "Upload release artifacts"
        if: env.PUBLISH_ARTIFACTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gh_release.outputs.version }}
        run: gh release upload "$VERSION" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
        shell: bash

      - name: "Register, publish and promote release"
        env:
          CHANNEL: ${{ needs.gh_release.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          GH_RELEASE_STATUS: ${{ needs.gh_release.outputs.status }}
          MANIFEST_EXISTS: ${{ needs.gh_release.outputs.manifest_exists }}
          VERSION: ${{ needs.gh_release.outputs.version }}
        run: |
          oidc_token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.zaku.dev" | jq --exit-status --raw-output '.value')

          if [[ "$MANIFEST_EXISTS" == "false" ]]; then
            request_body=$(gh release view "$VERSION" --json assets --repo "$GITHUB_REPOSITORY" --jq '{
              artifacts: [.assets[] | {
                name,
                size,
                sha256: (.digest | ltrimstr("sha256:"))
              }]
            }')
            curl -fsS -X PUT -H "Authorization: Bearer ${oidc_token}" --json "$request_body" "https://api.zaku.dev/releases/${CHANNEL}/${VERSION}"
          fi

          if [[ "$GH_RELEASE_STATUS" == "draft" ]]; then
            gh release edit "$VERSION" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
          fi

          curl -fsS -X PUT -H "Authorization: Bearer ${oidc_token}" "https://api.zaku.dev/releases/${CHANNEL}/latest"

          if [[ "$CHANNEL" == "stable" ]]; then
            gh release edit "$VERSION" --latest --repo "$GITHUB_REPOSITORY"
          fi

          echo "Released Zaku $VERSION"
        shell: bash

  resume_release:
    name: "Resume release"
    needs: gh_release
    if: needs.gh_release.outputs.manifest_exists == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISH_ARTIFACTS: "false"
    steps: *publish_steps
